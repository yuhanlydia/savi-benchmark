experiment:
  name: batch_smoke_math_qwen3_8b_nf4_16gb
  seed: 20260929
  suite_count: 1
  problem_ids: [omnimath-1958]
  spent_budgets: [4096]
  prefixes_per_cell: 4
  continuation_horizons: [0, 2048]
  continuations_per_state: 2
  trajectory_budget: 8192

model:
  id: Qwen/Qwen3-8B
  path: models/Qwen3-8B
  quantization: nf4
  dtype: bfloat16
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  finalizer_max_tokens: 128
  recent_window: 32

runtime:
  sampling_contract: grouped_rng_v1
  collect_state_features: false
  max_batch_context_tokens: 14000
  max_prefix_batch: 2
  max_continuation_batch: 2
  max_finalizer_batch: 2

data:
  path: third_party/R-3-Bench/datasets/math.jsonl
  split_manifest: artifacts/batch_smoke_math/manifest.json

output:
  root: outputs/batch_smoke_math
  prefixes: outputs/batch_smoke_math/prefixes.jsonl
  continuations: outputs/batch_smoke_math/continuations.jsonl
  state_values: outputs/batch_smoke_math/state_values.jsonl
  problem_features: outputs/batch_smoke_math/problem_features.jsonl
  report: outputs/batch_smoke_math/gates.json
  critic_dir: outputs/batch_smoke_math/critic

gates:
  primary_aliasing_gate: marginal_value
  range_threshold: 0.5
  min_range_cell_fraction: 0.20
  min_decision_flip_rate: 0.25
  dfr_bootstrap_draws: 100
  dispersion_null_draws: 100
  max_dispersion_null_pvalue: 0.05
  min_excess_range_fraction: 0.10
  min_mva_cell_fraction: 0.20
