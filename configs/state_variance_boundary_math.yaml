experiment:
  name: state_variance_boundary_math_qwen3_8b
  seed: 20260908
  problem_ids: [omnimath-1958]
  spent_budgets: [2048, 4096, 6144]
  prefixes_per_cell: 4
  continuation_horizons: [0, 2048]
  continuations_per_state: 4
  trajectory_budget: 8192

model:
  id: Qwen/Qwen3-8B
  path: models/Qwen3-8B
  quantization: nf4
  dtype: bfloat16
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  finalizer_max_tokens: 96
  recent_window: 32

data:
  path: third_party/R-3-Bench/datasets/math.jsonl
  split_manifest: artifacts/state_variance_boundary_math/manifest.json

output:
  root: outputs/state_variance_boundary_math
  prefixes: outputs/state_variance_boundary_math/prefixes.jsonl
  continuations: outputs/state_variance_boundary_math/continuations.jsonl
  state_values: outputs/state_variance_boundary_math/state_values.jsonl
  problem_features: outputs/state_variance_boundary_math/problem_features.jsonl
  report: outputs/state_variance_boundary_math/gates.json
  critic_dir: outputs/state_variance_boundary_math/critic

training:
  pca_components: 32
  hidden_size: 128
  ensemble_heads: 5
  epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 20
  train_suite_fraction: 0.7
  validation_suite_fraction: 0.15
  bootstrap_seed: 20260909

gates:
  range_threshold: 0.5
  min_range_cell_fraction: 0.20
  min_decision_flip_rate: 0.25
  dfr_bootstrap_draws: 1000
  dispersion_null_draws: 10000
  max_dispersion_null_pvalue: 0.05
  min_excess_range_fraction: 0.10
